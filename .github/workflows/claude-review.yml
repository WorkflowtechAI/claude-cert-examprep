# AUTO-SYNCED from the LLM Builder Kit. Do not edit here; edit the kit source and re-run sync-standards.ps1.

# Claude code review. Posts a review comment on every PR.
#
# A repo gets this file two ways: operator-tools/Bootstrap-Repo.ps1 at onboarding,
# or by naming claude-review in docs/standards/.standards-include, which puts it
# on the same drift check as every other vendored standard.
#
# Needs ANTHROPIC_API_KEY, as an organization secret visible to the repo or a repo
# secret. Bootstrap-Repo / Sync-Secrets sets the repo form; a repo that opted in
# later has to be granted the key, and the first step here fails loudly until it
# is. Fork PRs get no secret access.
#
# Third-party actions are SHA-pinned, the same supply-chain rule as
# ci-standards.yml: the tag comment is for humans, the SHA is what runs. To bump
# one, resolve the new tag to its COMMIT with
# `gh api repos/<owner>/<action>/commits/<tag> --jq .sha` (for an annotated tag,
# `git/ref/tags/<tag>` is the tag object, not the commit), then update the SHA
# and the comment together.
name: Claude code review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      review_scope:
        description: "Review scope: diff or full codebase"
        required: false
        default: "diff"
        type: choice
        options:
          - diff
          - full

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude code review
    # Hosted for a PUBLIC repo, the egi-vps pool for everything else.
    #
    # The org runner group excludes public repositories, so a public repo's job
    # on [self-hosted, ...] queues forever with correct labels and idle runners:
    # on claude-cert-examprep every review after the pool move sat queued, 8 h
    # and then 12 h, and cancel/reopen could not help. GitHub-hosted minutes are
    # free for public repos, and opening the pool to them would let fork PRs run
    # code on the VPS, so public goes hosted. The test is the string 'public' on
    # purpose: a missing or unknown visibility falls to the pool, which is the
    # private-repo default and stays a visibly queued, never-green check on a
    # public repo rather than silently billing a private one. (A queued check is
    # loud in the sense that it never goes green, not in the sense of an
    # immediate failure — GitHub times a job like that out, it does not fail it
    # fast.) test_claude_review.py pins this exact line.
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    # Only run with secrets for same-repo PRs; fork PRs never see the key.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-sonnet-5' }}
      # Per-repo ceiling without editing this vendored file: set a repository
      # variable. Unset, the script uses its own default (empty string fails
      # int() and falls through). The one repo that needed a higher ceiling had
      # edited this line by hand and tripped standards-drift doing it.
      CLAUDE_REVIEW_MAX_TOKENS: ${{ vars.CLAUDE_REVIEW_MAX_TOKENS }}
      REVIEW_PROJECT_NAME: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      REVIEW_SCOPE: ${{ github.event.inputs.review_scope || 'diff' }}
    steps:
      # The key is checked FIRST, and its absence is red.
      #
      # Without it the reviewer wrote "Skipped: ANTHROPIC_API_KEY is not
      # configured" and exited zero, so the PR showed a green "Claude code
      # review" check next to a review that never happened. A check that
      # reports success while skipping is worse than one that fails: the green
      # is what gets trusted, and review-standards.md feeds the auto-merge
      # verdict. Two repos ran in exactly that state.
      #
      # Same reason this is a step and not an `if:` on the job: a skipped job
      # also reports as not-failed.
      - name: Require the review key
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set for ${GITHUB_REPOSITORY}, so no review ran." \
                 "Set it as an organization secret (visible to this repo) or a repo secret," \
                 "or remove claude-review from docs/standards/.standards-include to stop asking for it."
            {
              echo "## Claude Code Review"
              echo
              echo "No review ran: \`ANTHROPIC_API_KEY\` is not configured for this repository."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Check out the base BRANCH, not the base SHA the event payload carries.
      #
      # `github.event.pull_request.base.sha` is the base tip as it stood when
      # the PR was opened, and GitHub does not refresh it when the base moves.
      # So a fix merged to the base after a PR was opened never reached that
      # PR's reviews. Measured on one managed repo: a PR opened against the
      # 8192-token reviewer stayed on it through every run AND re-run after
      # master had moved to the 32000-token one, the checkout step logged the
      # stale ref each time, and each review died on max_tokens. Rebasing the
      # PR was the only way the fix could reach it. A branch name is resolved
      # when the job runs, so it is whatever the base is NOW, re-runs included.
      #
      # This is still the trusted side of pull_request_target. The base branch
      # is repository history that only push access can change, and nothing
      # from the PR reaches this ref: its author picks the base from branches
      # that already exist here, and fork PRs never enter the job (the `if:`
      # above). What must never happen is checking out head.sha with secrets in
      # the environment, and that is unchanged. The diff under review comes
      # from the GitHub API by PR number, not from this checkout, so which
      # base commit is on disk does not change WHAT gets reviewed; it changes
      # which reviewer does the reviewing.
      #
      # workflow_dispatch has no pull request, so it falls back to the sha of
      # the ref it was dispatched on, as before.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.ref || github.sha }}
          fetch-depth: 0

      # The reviewer's own parsing is tested BEFORE it is trusted to review.
      # It failed silently once (thinking-block-first responses parsed to empty,
      # posted "No review text returned", and passed CI on ~2,048 billed output
      # tokens), so the response-shape handling now has to prove itself on every
      # run. Pure and network-free: no key, no API call, ~0.0s.
      - name: Test the reviewer before reviewing
        run: python .github/scripts/test_claude_review.py

      - name: Review with Claude
        run: python .github/scripts/claude_review.py

      - name: Print Claude review
        if: always()
        run: |
          if [ -s claude-review.md ]; then
            cat claude-review.md
          else
            echo "Claude review did not produce output."
          fi

      - name: Upload Claude review artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-review-${{ github.run_id }}
          path: claude-review.md
          if-no-files-found: ignore

      # always(), so a truncated or empty review is still POSTED where it can be
      # read. The check colour is decided separately, in the step after this one.
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request_target'
        run: |
          if [ -s claude-review.md ]; then
            if ! gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="$(cat claude-review.md)"; then
              echo "Failed to post Claude review as a PR comment; see job summary." >&2
            fi
          fi

      - name: Write job summary
        if: always()
        run: |
          if [ -s claude-review.md ]; then
            cat claude-review.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Claude review did not produce output." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A REVIEW THAT STOPPED EARLY DID NOT REVIEW THE REST.
      #
      # The truncation banner tells a human, but the green check is what gets
      # trusted and what feeds the auto-merge verdict in review-standards.md. A
      # review of PR #32 spent its entire 8,192-token ceiling on reasoning,
      # emitted the words "This diff", billed $0.15, and passed. Same rule as
      # the missing-key step at the top of this job: a check that pays, reports
      # success, and verified an unknown fraction of the diff is worse than one
      # that fails, because the green is what people act on.
      #
      # Runs LAST so the review is posted and summarised first.
      - name: Require a complete review
        if: always()
        run: |
          status="$(cat claude-review.status 2>/dev/null || echo missing)"
          case "$status" in
            ok|skipped)
              echo "Claude review status: $status"
              ;;
            truncated)
              echo "::error::The Claude review hit its output-token ceiling and is incomplete," \
                   "so an unknown part of this diff went unreviewed. Raise CLAUDE_REVIEW_MAX_TOKENS" \
                   "(currently ${CLAUDE_REVIEW_MAX_TOKENS:-the script default}) and re-run."
              exit 1
              ;;
            empty)
              echo "::error::The Claude review returned no text. This is a tooling failure," \
                   "not a clean bill of health. See the posted comment for stop_reason."
              exit 1
              ;;
            *)
              echo "::error::No Claude review status was written, so nothing proves a review ran." \
                   "Treating that as a failure rather than a pass."
              exit 1
              ;;
          esac
